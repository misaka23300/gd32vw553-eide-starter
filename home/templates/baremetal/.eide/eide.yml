version: "4.1"
name: "baremetal"
type: RISC-V
deviceName: null
packDir: null
srcDirs:
- ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/env_Eclipse
- ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/stubs
- ../../sdk/GD32VW55x_Firmware_Library/Firmware/GD32VW55x_standard_peripheral
virtualFolder:
  name: <virtual_root>
  files:
  - path: main.c
  - path: systick.c
  - path: systick.h
  - path: gd32vw55x_it.c
  - path: gd32vw55x_it.h
  - path: gd32vw55x_libopt.h
  - path: retarget.c
  folders: []
dependenceList: []
outDir: build_eide
miscInfo:
  uid: '00000000000000000000000000000000'
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
      - USE_STDPERIPH_DRIVER
      incList:
      - .
      - ../../sdk/GD32VW55x_Firmware_Library/Firmware/GD32VW55x_standard_peripheral
      - ../../sdk/GD32VW55x_Firmware_Library/Firmware/GD32VW55x_standard_peripheral/Include
      - ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/drivers
      - ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/stubs
      libList: []
    excludeList:
    - ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/stubs/write.c
    settings: {}
    toolchain: RISCV_GCC
    toolchainConfigMap:
      RISCV_GCC:
        linkerScriptPath: ../../sdk/GD32VW55x_Firmware_Library/Firmware/RISCV/env_Eclipse/GD32VW553xM.lds
        options:
          version: 2
          beforeBuildTasks: []
          afterBuildTasks: []
          global:
            output-debug-info: enable
            arch: rv32imafdc
            abi: ilp32d
            code-model: medlow
            misc-control: ''
          c/cpp-compiler:
            language-c: gnu11
            language-cpp: gnu++17
            optimization: level-2
            warnings: all-warnings
            one-elf-section-per-function: true
            one-elf-section-per-data: true
            C_FLAGS: ''
          asm-compiler:
            ASM_FLAGS: ''
          linker:
            output-format: elf
            remove-unused-input-sections: true
            LD_FLAGS: -nostartfiles
            LIB_FLAGS: -lm -lc -lgcc
            $toolName: auto
    uploadConfigMap:
      OpenOCD:
        bin: ''
        target: gd32vw55x
        interface: ${workspaceFolder}/.eide/gd32vw553
        baseAddr: '0x08000000'
    uploader: OpenOCD
